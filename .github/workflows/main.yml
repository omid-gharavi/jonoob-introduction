name: build

on: 
    push:
        branches: [main]

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
          - name: Get Code
            uses: actions/checkout@v4

          - name: Nodejs
            uses: actions/setup-node@v4
            with:
              node-version: 4
              cache: npm

          - name: Install Packages
            run: npm ci

          - name: Build
            run: npm run build
